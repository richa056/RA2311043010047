<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Campus Notification Priority Inbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0b0c10;
      --surface: #13141a;
      --surface2: #1c1e27;
      --border: #2a2d3a;
      --text: #e8eaf0;
      --muted: #6b7080;
      --placement: #f5a623;
      --result: #4fc3f7;
      --event: #81c784;
      --accent: #f5a623;
      --danger: #ef5350;
      --log-bg: #0d0e13;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
    }
    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    header h1 span { color: var(--accent); }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .controls label { font-size: 0.75rem; color: var(--muted); }
    .controls select {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 7px 16px;
      border-radius: 6px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.75rem;
    }
    .btn-outline:hover { border-color: var(--text); color: var(--text); }
    main {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 0;
      height: calc(100vh - 65px);
    }
    .inbox-panel {
      padding: 24px 28px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }
    .inbox-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .inbox-header h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
    }
    .badge-count {
      background: var(--surface2);
      color: var(--muted);
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .legend {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .notif-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: border-color 0.2s, transform 0.15s;
      animation: slideIn 0.3s ease both;
    }
    .notif-card:hover { border-color: var(--muted); transform: translateX(2px); }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .notif-card.placement { border-left: 3px solid var(--placement); }
    .notif-card.result    { border-left: 3px solid var(--result); }
    .notif-card.event     { border-left: 3px solid var(--event); }
    .rank-num {
      font-family: 'Syne', sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--muted);
      min-width: 22px;
      padding-top: 2px;
    }
    .notif-body { flex: 1; }
    .notif-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .type-badge {
      font-size: 0.62rem;
      font-weight: 600;
      font-family: 'Syne', sans-serif;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .type-badge.placement { background: rgba(245,166,35,0.15); color: var(--placement); }
    .type-badge.result    { background: rgba(79,195,247,0.15); color: var(--result); }
    .type-badge.event     { background: rgba(129,199,132,0.15); color: var(--event); }
    .score-pill {
      font-size: 0.6rem;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .notif-message { font-size: 0.82rem; line-height: 1.4; margin-bottom: 6px; }
    .notif-time { font-size: 0.68rem; color: var(--muted); }
    .state-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .log-section {
      display: flex;
      flex-direction: column;
      background: var(--log-bg);
    }
    .log-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .log-header h3 {
      font-family: 'Syne', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #log-panel {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      font-size: 0.68rem;
      line-height: 1.7;
    }
    .log-entry { padding: 1px 0; }
    .log-time { color: #3a3d4a; }
    .log-level { font-weight: 600; margin: 0 4px; }
    .log-entry.log-info  .log-level { color: #4fc3f7; }
    .log-entry.log-warn  .log-level { color: #f5a623; }
    .log-entry.log-error .log-level { color: #ef5350; }
    .log-entry.log-debug .log-level { color: #ab47bc; }
    .log-msg { color: #8a8f9e; }
  </style>
</head>
<body>

<header>
  <h1>Campus <span>Priority</span> Inbox</h1>
  <div class="controls">
    <label>Show top</label>
    <select id="topN">
      <option value="10" selected>10</option>
      <option value="15">15</option>
      <option value="20">20</option>
    </select>
    <button class="btn" id="fetchBtn" onclick="fetchAndRender()">⟳ Fetch</button>
    <button class="btn btn-outline" onclick="Logger.clearLogs()">Clear Logs</button>
  </div>
</header>

<main>
  <div class="inbox-panel">
    <div class="inbox-header">
      <h2>Unread Notifications</h2>
      <span class="badge-count" id="countBadge">0 shown</span>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="dot" style="background:var(--placement)"></div>Placement (weight 3)</div>
      <div class="legend-item"><div class="dot" style="background:var(--result)"></div>Result (weight 2)</div>
      <div class="legend-item"><div class="dot" style="background:var(--event)"></div>Event (weight 1)</div>
    </div>
    <div class="notif-list" id="notifList">
      <div class="state-msg">Click <strong>Fetch</strong> to load notifications.</div>
    </div>
  </div>

  <div class="log-section">
    <div class="log-header">
      <h3>Middleware Logs</h3>
    </div>
    <div id="log-panel"></div>
  </div>
</main>

<script>
// Custom Logging Middleware — logging_middleware/logger.js
const LOG_LEVELS = { INFO: "INFO", WARN: "WARN", ERROR: "ERROR", DEBUG: "DEBUG" };
const logStore = [];

function getTimestamp() { return new Date().toISOString(); }

function writeLog(level, message, meta = {}) {
  const entry = { timestamp: getTimestamp(), level, message, meta };
  logStore.push(entry);
  const panel = document.getElementById("log-panel");
  if (panel) {
    const div = document.createElement("div");
    div.className = `log-entry log-${level.toLowerCase()}`;
    const metaStr = Object.keys(meta).length ? " — " + JSON.stringify(meta) : "";
    div.innerHTML = `<span class="log-time">${entry.timestamp}</span><span class="log-level">[${level}]</span><span class="log-msg">${message}${metaStr}</span>`;
    panel.appendChild(div);
    panel.scrollTop = panel.scrollHeight;
  }
  return entry;
}

const Logger = {
  info:  (msg, meta={}) => writeLog(LOG_LEVELS.INFO,  msg, meta),
  warn:  (msg, meta={}) => writeLog(LOG_LEVELS.WARN,  msg, meta),
  error: (msg, meta={}) => writeLog(LOG_LEVELS.ERROR, msg, meta),
  debug: (msg, meta={}) => writeLog(LOG_LEVELS.DEBUG, msg, meta),
  getLogs: () => [...logStore],
  clearLogs: () => {
    logStore.length = 0;
    const p = document.getElementById("log-panel");
    if (p) p.innerHTML = "";
  },
};

function requestMiddleware(url, method = "GET") {
  const start = Date.now();
  Logger.info("HTTP request started", { method, url });
  return {
    end: (status, extra={}) => {
      Logger.info("HTTP request completed", { method, url, status, duration: `${Date.now()-start}ms`, ...extra });
    },
    fail: (err) => {
      Logger.error("HTTP request failed", { method, url, error: err.message, duration: `${Date.now()-start}ms` });
    }
  };
}
</script>

<script>
// Priority Logic + App
const TYPE_WEIGHT = { Placement: 3, Result: 2, Event: 1 };

function computeScore(notification) {
  const typeWeight = TYPE_WEIGHT[notification.Type] || 0;
  const ts = new Date(notification.Timestamp).getTime();
  const now = Date.now();
  const hoursAgo = (now - ts) / (1000 * 60 * 60);
  const recencyBonus = hoursAgo <= 24 ? 1 : 0;
  const score = typeWeight + recencyBonus;
  Logger.debug("Score computed", { id: notification.ID, type: notification.Type, score });
  return score;
}

class MaxHeap {
  constructor() { this.heap = []; }
  _compare(a, b) {
    if (b.score !== a.score) return b.score - a.score;
    return new Date(b.Timestamp) - new Date(a.Timestamp);
  }
  insert(item) {
    this.heap.push(item);
    this.heap.sort((a, b) => this._compare(a, b));
    Logger.debug("Heap insert", { id: item.ID, score: item.score });
  }
  topN(n) { return this.heap.slice(0, n); }
}

async function fetchAndRender() {
  const btn = document.getElementById("fetchBtn");
  const list = document.getElementById("notifList");
  const N = parseInt(document.getElementById("topN").value);
  const API_URL = "http://20.207.122.201/evaluation-service/notifications";

  btn.disabled = true;
  list.innerHTML = `<div class="state-msg"><div class="spinner"></div>Fetching notifications...</div>`;
  Logger.info("Fetch initiated", { topN: N });

  const req = requestMiddleware(API_URL, "GET");

  try {
    const response = await fetch(API_URL);
    if (!response.ok) {
      req.fail(new Error(`HTTP ${response.status}`));
      list.innerHTML = `<div class="state-msg">API returned status ${response.status}</div>`;
      btn.disabled = false;
      return;
    }
    const data = await response.json();
    req.end(response.status, { total: data.notifications?.length || 0 });

    const notifications = data.notifications || [];
    Logger.info("Notifications received", { count: notifications.length });

    if (notifications.length === 0) {
      Logger.warn("Empty notifications array");
      list.innerHTML = `<div class="state-msg">No notifications found.</div>`;
      btn.disabled = false;
      return;
    }

    Logger.info("Building max-heap...");
    const heap = new MaxHeap();
    for (const notif of notifications) {
      notif.score = computeScore(notif);
      heap.insert(notif);
    }

    const topNotifs = heap.topN(N);
    Logger.info("Top notifications extracted", { requested: N, returned: topNotifs.length });
    renderNotifications(topNotifs);
    document.getElementById("countBadge").textContent = `${topNotifs.length} shown`;
    Logger.info("UI render complete");

  } catch (err) {
    req.fail(err);
    Logger.error("Fetch failed", { error: err.message });
    list.innerHTML = `<div class="state-msg">Failed to fetch: ${err.message}</div>`;
  }
  btn.disabled = false;
}

function renderNotifications(notifications) {
  const list = document.getElementById("notifList");
  list.innerHTML = "";
  notifications.forEach((notif, i) => {
    const type = notif.Type?.toLowerCase() || "event";
    const card = document.createElement("div");
    card.className = `notif-card ${type}`;
    card.style.animationDelay = `${i * 40}ms`;
    card.innerHTML = `
      <div class="rank-num">#${i + 1}</div>
      <div class="notif-body">
        <div class="notif-top">
          <span class="type-badge ${type}">${notif.Type}</span>
          <span class="score-pill">score: ${notif.score}</span>
        </div>
        <div class="notif-message">${notif.Message}</div>
        <div class="notif-time">${new Date(notif.Timestamp).toLocaleString()}</div>
      </div>`;
    list.appendChild(card);
  });
}

window.addEventListener("DOMContentLoaded", () => {
  Logger.info("Campus Priority Inbox initialized");
  Logger.info("Custom logging middleware active — no console.log used");
});
</script>

</body>
</html>
