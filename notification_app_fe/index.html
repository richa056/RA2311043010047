<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Campus Notification Priority Inbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0b0c10;
      --surface: #13141a;
      --surface2: #1c1e27;
      --border: #2a2d3a;
      --text: #e8eaf0;
      --muted: #6b7080;
      --placement: #f5a623;
      --result: #4fc3f7;
      --event: #81c784;
      --accent: #f5a623;
      --log-bg: #0d0e13;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
    }

    header h1 span { color: var(--accent); }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .controls select,
    .controls button {
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-family: inherit;
    }

    .btn {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .btn:disabled { opacity: 0.5; }

    main {
      display: grid;
      grid-template-columns: 1fr 340px;
      height: calc(100vh - 70px);
    }

    .inbox-panel {
      padding: 24px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }

    .inbox-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notif-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      gap: 14px;
    }

    .notif-card.placement { border-left: 4px solid var(--placement); }
    .notif-card.result { border-left: 4px solid var(--result); }
    .notif-card.event { border-left: 4px solid var(--event); }

    .rank-num {
      color: var(--muted);
      font-weight: bold;
      min-width: 24px;
    }

    .notif-message {
      font-size: 0.82rem;
      margin: 6px 0;
    }

    .notif-time {
      color: var(--muted);
      font-size: 0.68rem;
    }

    .type-badge {
      font-size: 0.62rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: bold;
    }

    .type-badge.placement {
      background: rgba(245,166,35,0.15);
      color: var(--placement);
    }

    .type-badge.result {
      background: rgba(79,195,247,0.15);
      color: var(--result);
    }

    .type-badge.event {
      background: rgba(129,199,132,0.15);
      color: var(--event);
    }

    .score-pill {
      font-size: 0.6rem;
      color: var(--muted);
      margin-left: 8px;
    }

    .state-msg {
      text-align: center;
      padding: 60px;
      color: var(--muted);
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .log-section {
      background: var(--log-bg);
      display: flex;
      flex-direction: column;
    }

    .log-header {
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    #log-panel {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
      font-size: 0.68rem;
    }

    .log-entry {
      margin-bottom: 6px;
    }

    .log-info { color: #4fc3f7; }
    .log-warn { color: #f5a623; }
    .log-error { color: #ef5350; }
    .log-debug { color: #ab47bc; }
  </style>
</head>
<body>

<header>
  <h1>Campus <span>Priority</span> Inbox</h1>
  <div class="controls">
    <select id="topN">
      <option value="10">10</option>
      <option value="15">15</option>
      <option value="20">20</option>
    </select>
    <button class="btn" id="fetchBtn" onclick="fetchAndRender()">Fetch</button>
    <button onclick="Logger.clearLogs()">Clear Logs</button>
  </div>
</header>

<main>
  <div class="inbox-panel">
    <div class="inbox-header">
      <h2>Unread Notifications</h2>
      <span id="countBadge">0 shown</span>
    </div>
    <div class="notif-list" id="notifList">
      <div class="state-msg">Click Fetch to load notifications.</div>
    </div>
  </div>

  <div class="log-section">
    <div class="log-header">
      <h3>Middleware Logs</h3>
    </div>
    <div id="log-panel"></div>
  </div>
</main>

<script>
const AUTH_TOKEN = "const AUTH_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJNYXBDbGFpbXMiOnsiYXVkIjoiaHR0cDovLzIwLjI0NC41Ni4xNDQvZXZhbHVhdGlvbi1zZXJ2aWNlIiwiZW1haWwiOiJycjQwOTlAc3JtaXN0LmVkdS5pbiIsImV4cCI6MTc3NzcwMzUzMCwiaWF0IjoxNzc3NzAyNjMwLCJpc3MiOiJBZmZvcmQgTWVkaWNhbCBUZWNobm9sb2dpZXMgUHJpdmF0ZSBMaW1pdGVkIiwianRpIjoiODUxOWViZjUtOTJhOS00NjhkLTkzNTItYTVjYTQ1YmE2OWZlIiwibG9jYWxlIjoiZW4tSU4iLCJuYW1lIjoicmljaGEiLCJzdWIiOiIyN2NjYjg4OS01NTYxLTQ3ZjMtYWQyOS01Yzc0Njk4MDI5OWEifSwiZW1haWwiOiJycjQwOTlAc3JtaXN0LmVkdS5pbiIsIm5hbWUiOiJyaWNoYSIsInJvbGxObyI6InJhMjMxMTA0MzAxMDA0NyIsImFjY2Vzc0NvZGUiOiJRa2JweEgiLCJjbGllbnRJRCI6IjI3Y2NiODg5LTU1NjEtNDdmMy1hZDI5LTVjNzQ2OTgwMjk5YSIsImNsaWVudFNlY3JldCI6ImtYRnpRS1J2ZXRqZFJ4Um0ifQ.N5ADgxamhOYxQ_qUxLdMx03f6k102bRl8fY_Spoua_k";

const BASE_URL = "http://20.244.56.144/evaluation-service";
const NOTIF_API = `${BASE_URL}/notifications`;
const LOG_API = `${BASE_URL}/logs`;

const TYPE_WEIGHT = {
  Placement: 3,
  Result: 2,
  Event: 1
};

function timestamp() {
  return new Date().toISOString();
}

function renderLog(level, msg) {
  const panel = document.getElementById("log-panel");
  const div = document.createElement("div");
  div.className = `log-entry log-${level}`;
  div.innerHTML = `[${timestamp()}] [${level.toUpperCase()}] ${msg}`;
  panel.appendChild(div);
  panel.scrollTop = panel.scrollHeight;
}

async function sendLog(level, pkg, message) {
  renderLog(level, `[${pkg}] ${message}`);

  try {
    await fetch(LOG_API, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${AUTH_TOKEN}`,
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({
        stack: "frontend",
        level,
        package: pkg,
        message
      })
    });
  } catch (err) {
    renderLog("warn", `Log failed: ${err.message}`);
  }
}

const Logger = {
  info: (pkg, msg) => sendLog("info", pkg, msg),
  warn: (pkg, msg) => sendLog("warn", pkg, msg),
  error: (pkg, msg) => sendLog("error", pkg, msg),
  debug: (pkg, msg) => sendLog("debug", pkg, msg),
  clearLogs: () => {
    document.getElementById("log-panel").innerHTML = "";
  }
};

function computeScore(notification) {
  const typeWeight = TYPE_WEIGHT[notification.Type] || 0;
  const hoursAgo = (Date.now() - new Date(notification.Timestamp).getTime()) / 3600000;
  const recencyBonus = hoursAgo <= 24 ? 1 : 0;
  return typeWeight + recencyBonus;
}

async function fetchAndRender() {
  const btn = document.getElementById("fetchBtn");
  const list = document.getElementById("notifList");
  const topN = parseInt(document.getElementById("topN").value);

  btn.disabled = true;
  list.innerHTML = `<div class="state-msg"><div class="spinner"></div>Fetching...</div>`;

  await Logger.info("api", `Fetching top ${topN} notifications`);

  try {
    const response = await fetch(NOTIF_API, {
      method: "GET",
      headers: {
        "Authorization": `Bearer ${AUTH_TOKEN}`,
        "Content-Type": "application/json",
        "Accept": "application/json"
      }
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();
    const notifications = data.notifications || [];

    notifications.forEach(n => {
      n.score = computeScore(n);
    });

    notifications.sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return new Date(b.Timestamp) - new Date(a.Timestamp);
    });

    const topNotifications = notifications.slice(0, topN);

    renderNotifications(topNotifications);

    document.getElementById("countBadge").textContent = `${topNotifications.length} shown`;

    await Logger.info("component", `Rendered ${topNotifications.length} notifications`);

  } catch (err) {
    list.innerHTML = `<div class="state-msg">Error: ${err.message}</div>`;
    await Logger.error("api", err.message);
  }

  btn.disabled = false;
}

function renderNotifications(notifications) {
  const list = document.getElementById("notifList");
  list.innerHTML = "";

  if (!notifications.length) {
    list.innerHTML = `<div class="state-msg">No notifications found.</div>`;
    return;
  }

  notifications.forEach((notif, i) => {
    const type = (notif.Type || "Event").toLowerCase();

    const card = document.createElement("div");
    card.className = `notif-card ${type}`;

    card.innerHTML = `
      <div class="rank-num">#${i + 1}</div>
      <div>
        <div>
          <span class="type-badge ${type}">${notif.Type}</span>
          <span class="score-pill">score: ${notif.score}</span>
        </div>
        <div class="notif-message">${notif.Message}</div>
        <div class="notif-time">${new Date(notif.Timestamp).toLocaleString()}</div>
      </div>
    `;

    list.appendChild(card);
  });
}

window.addEventListener("DOMContentLoaded", async () => {
  await Logger.info("page", "Campus Priority Inbox initialized");
  await Logger.info("middleware", "Logging middleware active");
});
</script>

</body>
</html>
